version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    # pydantic pins pydantic-core to an exact version, so bumping core alone
    # breaks the install — bump it by hand alongside pydantic instead.
    ignore:
      - dependency-name: "pydantic-core"
    groups:
      pip-production-non-major:
        dependency-type: production
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      pip-development-non-major:
        dependency-type: development
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      npm-production-non-major:
        dependency-type: production
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      npm-development-non-major:
        dependency-type: development
        patterns:
          - "*"
        update-types:
          - minor
          - patch